    <style>
      /* =========================================================================
         SWARNA & RAMASAMY — LOTUS LEAF CUSTOM ENHANCEMENTS
         ========================================================================= */

      /* Story Paragraphs Styling */
      .story__body {
        margin: 24px 0 28px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .story__p {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 19px;
        line-height: 1.75;
        color: var(--ink);
        margin: 0;
        font-weight: 500;
        letter-spacing: 0.01em;
      }

      /* Picture Collage (Memories Section) */
      .gallery-section {
        background: linear-gradient(180deg, var(--ivory) 0%, #e7e2c4 50%, var(--ivory) 100%);
        padding: 90px 22px;
      }
      .gallery__header {
        text-align: center;
        max-width: 520px;
        margin: 0 auto 40px;
      }
      .gallery__container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 24px;
        max-width: 1040px;
        margin: 0 auto;
      }
      .gallery__card {
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(216, 154, 43, 0.35);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(38, 50, 16, 0.08);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        display: flex;
        flex-direction: column;
      }
      .gallery__card:hover {
        transform: translateY(-4px);
        box-shadow: 0 16px 36px rgba(38, 50, 16, 0.14);
        border-color: rgba(216, 154, 43, 0.65);
      }
      .gallery__img-box {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 5;
        overflow: hidden;
        background: #18240f;
      }
      .gallery__img-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 20%;
        display: block;
        transition: transform 0.6s ease;
      }
      .gallery__card:hover .gallery__img-box img {
        transform: scale(1.04);
      }
      .gallery__overlay {
        padding: 16px 18px 20px;
        text-align: center;
      }
      .gallery__tag {
        display: inline-block;
        font-family: Manrope, sans-serif;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: var(--pink);
        font-weight: 700;
        margin-bottom: 6px;
      }
      .gallery__caption {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 19px;
        font-weight: 600;
        color: var(--ink);
        margin: 0;
        line-height: 1.35;
      }

      /* Friends & Family Circle Section */
      .friends-section {
        background: var(--ivory);
        padding: 90px 22px;
      }
      .friends__header {
        text-align: center;
        max-width: 560px;
        margin: 0 auto 40px;
      }
      .friends__grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 22px;
        max-width: 960px;
        margin: 0 auto;
      }
      .friends__card {
        background: rgba(255, 252, 242, 0.75);
        border: 1px solid rgba(216, 154, 43, 0.4);
        border-radius: 14px;
        padding: 24px 20px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(38, 50, 16, 0.06);
        transition: transform 0.25s ease;
      }
      .friends__card:hover {
        transform: translateY(-3px);
        border-color: rgba(216, 154, 43, 0.7);
      }
      .friends__icon {
        margin-bottom: 12px;
        display: flex;
        justify-content: center;
      }
      .friends__card h3 {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--ink);
        margin: 0 0 8px;
        letter-spacing: 0.02em;
      }
      .friends__card p {
        font-family: Manrope, sans-serif;
        font-size: 13px;
        line-height: 1.6;
        color: rgba(38, 50, 16, 0.85);
        margin: 0;
      }
      .friends__note {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-style: italic;
        font-size: 20px;
        font-weight: 600;
        text-align: center;
        color: var(--rose);
        margin: 36px auto 0;
        max-width: 500px;
      }

      /* Floating Background Music Controller */
      .bg-music-toggle {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 999;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(18, 26, 14, 0.9);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1.5px solid rgba(216, 154, 43, 0.8);
        color: #f7e6b5;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(216, 154, 43, 0.3);
        transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
      }
      .bg-music-toggle:hover {
        transform: scale(1.08);
        border-color: #ffd875;
        background: rgba(30, 42, 22, 0.95);
      }
      .bg-music-toggle.is-playing svg {
        animation: spin-music 5s linear infinite;
      }
      @keyframes spin-music {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @media (max-width: 640px) {
        .bg-music-toggle {
          bottom: 18px;
          right: 18px;
          width: 44px;
          height: 44px;
        }
        .gallery-section, .friends-section {
          padding: 60px 16px;
        }
        .story__p {
          font-size: 17px;
        }
      }
    </style>

  <body>
    <!-- React Root Container -->
    <div id="root"></div>

    <!-- Background Music Audio (96 Movie - Kaathale Kaathale) -->
    <audio id="bg-audio" loop preload="auto">
      <source src="./assets/kathale_kathale.webm" type="audio/webm" />
    </audio>

    <!-- Floating Music Toggle Button -->
    <button id="music-toggle" class="bg-music-toggle" aria-label="Toggle background music" style="display: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </button>

    <script>
      (function() {
        const audio = document.getElementById('bg-audio');
        const toggleBtn = document.getElementById('music-toggle');
        let isStarted = false;

        audio.muted = false;

        // Sync with WEDDING_DATA music track if specified
        if (window.WEDDING_DATA && window.WEDDING_DATA.music && window.WEDDING_DATA.music.src) {
          const srcTag = audio.querySelector('source');
          if (srcTag && srcTag.getAttribute('src') !== window.WEDDING_DATA.music.src) {
            srcTag.src = window.WEDDING_DATA.music.src;
            audio.load();
          }
        }

        window.startBgMusic = function() {
          if (!isStarted) {
            isStarted = true;
          }
          audio.muted = false;
          audio.play().then(() => {
            toggleBtn.style.display = 'flex';
            toggleBtn.classList.add('is-playing');
          }).catch((err) => {
            // Browser autoplay restrictions handled on next tap
            toggleBtn.style.display = 'flex';
            toggleBtn.classList.remove('is-playing');
          });
        };

        // User interactions will trigger music playback
        document.addEventListener('pointerdown', function() {
          if (!isStarted) window.startBgMusic();
        }, { passive: true });

        document.addEventListener('click', function() {
          if (!isStarted) window.startBgMusic();
        }, { passive: true });

        // Toggle button click handler
        toggleBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (audio.paused || audio.muted) {
            audio.muted = false;
            audio.play().then(() => {
              toggleBtn.classList.add('is-playing');
            }).catch(console.error);
          } else {
            audio.pause();
            toggleBtn.classList.remove('is-playing');
          }
        });
      })();
    </script>
  </body>
